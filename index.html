<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Matching System</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function DogMatcher() {
          const [view, setView] = useState('about');
          const [dogs, setDogs] = useState([]);
          const [matches, setMatches] = useState([]);
          
          const [userPrefs, setUserPrefs] = useState({
            livingSpace: 'house',
            hasYard: 'yes',
            experience: 'some',
            activity: 'moderate',
            hasChildren: 'no',
            hasPets: 'no',
            petType: 'none',
            groomingTime: 'moderate',
            needsHypoallergenic: 'no',
            trainingTime: 'yes'
          });

          useEffect(() => {
            const csvData = `Name,Sex,Breed,Age,Size,Energy Level,Temperament,Grooming Needs,Experience Required,Hypoallergenic,Potty trained,Leash trained,Crate trained,Good with other dogs,Good with cats,Good with little kids
Muffin,Female,Basset Hound & Hound Mix,4 years,Medium,High,Friendly social sweet,Low,None,No,Yes,Yes,Yes,Yes,No,Yes
Julius,Male,Australian Cattle Dog Mix,6 months,Medium,High,Playful sweet,Low,None,No,Yes,Yes,Yes,Yes,Unknown,Yes
Mollie,Female,Shepherd Mix,10 years,Medium,Medium,Friendly gentle anxious,Medium,None,No,Yes,Yes,Yes,Yes,No,Yes
Buttermilk,Male,Terrier Mix,6 months,Medium,High,Friendly active,Low,None,No,No,No,No,Yes,Unknown,No
Chrissy,Female,Hound Mix,3 years,Medium,High,Loving exciteable,Low,None,No,Yes,No,Yes,Yes,No,Yes
Lotte,Female,Mountain Cur Mix,8 years,Medium,Medium,Anxious smart loving,Low,None,No,Yes,Yes,Yes,Yes,Unknown,No
Waffles,Male,Terrier Mix,6 months,Medium,High,Friendly active,Low,None,No,No,No,No,Yes,Unknown,No
Lacey Lou,Female,Hound & Mixed Breed Mix,7 months,Medium,High,Social sweet,Low,None,No,No,No,Yes,Yes,Unknown,No
Copper,Male,Australian Cattle Dog & Lab Mix,4 years,Medium,High,Affectionate smart,Low,None,No,Yes,Yes,Yes,Yes,Yes,No
Cagney,Female,Chesapeake Bay Retriever Mix,6 months,Medium,High,Outgoing friendly,Low,None,No,Yes,No,No,Yes,Yes,No`;
            
            Papa.parse(csvData, {
              header: true,
              skipEmptyLines: true,
              complete: (results) => {
                const importedDogs = results.data.map((row, index) => ({
                  id: index,
                  name: row.Name,
                  breed: row.Breed,
                  age: row.Age,
                  sex: row.Sex,
                  size: row.Size.toLowerCase(),
                  energy: row['Energy Level'].toLowerCase(),
                  temperament: row.Temperament.split(' '),
                  goodWithOtherDogs: row['Good with other dogs'].toLowerCase(),
                  goodWithCats: row['Good with cats'].toLowerCase(),
                  goodWithKids: row['Good with little kids'].toLowerCase(),
                  grooming: row['Grooming Needs'].toLowerCase(),
                  experience: row['Experience Required'].toLowerCase() === 'none' ? 'any' : row['Experience Required'].toLowerCase(),
                  hypoallergenic: row.Hypoallergenic.toLowerCase() === 'yes',
                  leashTrained: row['Leash trained'].toLowerCase() === 'yes',
                  pottyTrained: row['Potty trained'].toLowerCase() === 'yes',
                  crateTrained: row['Crate trained'].toLowerCase() === 'yes'
                }));
                setDogs(importedDogs);
              }
            });
          }, []);

          const calculateMatch = () => {
            const scored = dogs.map(dog => {
              let score = 75; // Base score
              
              // Simple matching logic
              if (userPrefs.activity === 'low' && dog.energy === 'high') score -= 20;
              if (userPrefs.activity === 'active' && dog.energy === 'low') score -= 20;
              if (userPrefs.hasChildren === 'yes' && dog.goodWithKids === 'no') score -= 30;
              if (userPrefs.hasPets === 'yes' && userPrefs.petType === 'dog' && dog.goodWithOtherDogs === 'no') score -= 30;
              if (userPrefs.hasPets === 'yes' && userPrefs.petType === 'cat' && dog.goodWithCats === 'no') score -= 30;
              if (userPrefs.needsHypoallergenic === 'yes' && !dog.hypoallergenic) score = 0;
              
              return { ...dog, matchScore: Math.max(0, score) };
            });

            setMatches(scored.sort((a, b) => b.matchScore - a.matchScore));
            setView('results');
          };

          return (
            <div style={{ minHeight: '100vh', background: 'linear-gradient(to bottom right, #eff6ff, #f3e8ff)', padding: '24px' }}>
              <div style={{ maxWidth: '1200px', margin: '0 auto' }}>
                <div style={{ textAlign: 'center', marginBottom: '32px' }}>
                  <h1 style={{ fontSize: '36px', fontWeight: 'bold', color: '#1f2937', marginBottom: '8px' }}>
                    🐕 Dog Matching System
                  </h1>
                  <p style={{ color: '#6b7280' }}>Find the perfect furry companion</p>
                </div>

                <div style={{ display: 'flex', gap: '16px', marginBottom: '24px', justifyContent: 'center', flexWrap: 'wrap' }}>
                  <button
                    onClick={() => setView('about')}
                    style={{
                      padding: '8px 24px',
                      borderRadius: '8px',
                      border: 'none',
                      cursor: 'pointer',
                      background: view === 'about' ? '#9333ea' : 'white',
                      color: view === 'about' ? 'white' : '#374151'
                    }}
                  >
                    ℹ️ About
                  </button>
                  <button
                    onClick={() => setView('quiz')}
                    style={{
                      padding: '8px 24px',
                      borderRadius: '8px',
                      border: 'none',
                      cursor: 'pointer',
                      background: view === 'quiz' ? '#9333ea' : 'white',
                      color: view === 'quiz' ? 'white' : '#374151'
                    }}
                  >
                    👤 Find Your Match
                  </button>
                  <button
                    onClick={() => setView('all-dogs')}
                    style={{
                      padding: '8px 24px',
                      borderRadius: '8px',
                      border: 'none',
                      cursor: 'pointer',
                      background: view === 'all-dogs' ? '#9333ea' : 'white',
                      color: view === 'all-dogs' ? 'white' : '#374151'
                    }}
                  >
                    📋 All Dogs ({dogs.length})
                  </button>
                </div>

                {view === 'about' && (
                  <div style={{ maxWidth: '800px', margin: '0 auto', background: 'white', borderRadius: '12px', padding: '32px', boxShadow: '0 10px 15px -3px rgba(0,0,0,0.1)' }}>
                    <h2 style={{ fontSize: '28px', fontWeight: 'bold', marginBottom: '24px' }}>About Our Dog Matching Service</h2>
                    <p style={{ marginBottom: '16px', lineHeight: '1.6' }}>
                      Welcome to our dog matching system! We help you find the perfect canine companion that fits your lifestyle.
                    </p>
                    <h3 style={{ fontSize: '20px', fontWeight: '600', marginTop: '24px', marginBottom: '12px' }}>How It Works</h3>
                    <p style={{ marginBottom: '16px', lineHeight: '1.6' }}>
                      Our matching algorithm considers your living space, activity level, experience, family situation, and more to find compatible dogs.
                    </p>
                  </div>
                )}

                {view === 'quiz' && (
                  <div style={{ maxWidth: '600px', margin: '0 auto', background: 'white', borderRadius: '12px', padding: '32px', boxShadow: '0 10px 15px -3px rgba(0,0,0,0.1)' }}>
                    <h2 style={{ fontSize: '24px', fontWeight: 'bold', marginBottom: '24px' }}>Tell Us About Yourself</h2>
                    
                    <div style={{ marginBottom: '16px' }}>
                      <label style={{ display: 'block', fontSize: '14px', fontWeight: '500', marginBottom: '8px' }}>Living Space</label>
                      <select
                        value={userPrefs.livingSpace}
                        onChange={(e) => setUserPrefs(prev => ({ ...prev, livingSpace: e.target.value }))}
                        style={{ width: '100%', padding: '8px 16px', border: '1px solid #d1d5db', borderRadius: '8px' }}
                      >
                        <option value="apartment">Apartment</option>
                        <option value="house">House</option>
                      </select>
                    </div>

                    <div style={{ marginBottom: '16px' }}>
                      <label style={{ display: 'block', fontSize: '14px', fontWeight: '500', marginBottom: '8px' }}>Do you have a yard?</label>
                      <select
                        value={userPrefs.hasYard}
                        onChange={(e) => setUserPrefs(prev => ({ ...prev, hasYard: e.target.value }))}
                        style={{ width: '100%', padding: '8px 16px', border: '1px solid #d1d5db', borderRadius: '8px' }}
                      >
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                      </select>
                    </div>

                    <div style={{ marginBottom: '16px' }}>
                      <label style={{ display: 'block', fontSize: '14px', fontWeight: '500', marginBottom: '8px' }}>Activity Level</label>
                      <select
                        value={userPrefs.activity}
                        onChange={(e) => setUserPrefs(prev => ({ ...prev, activity: e.target.value }))}
                        style={{ width: '100%', padding: '8px 16px', border: '1px solid #d1d5db', borderRadius: '8px' }}
                      >
                        <option value="low">Low (Short walks)</option>
                        <option value="moderate">Moderate (Regular walks)</option>
                        <option value="active">Active (Long walks, running)</option>
                      </select>
                    </div>

                    <div style={{ marginBottom: '16px' }}>
                      <label style={{ display: 'block', fontSize: '14px', fontWeight: '500', marginBottom: '8px' }}>Do you have children?</label>
                      <select
                        value={userPrefs.hasChildren}
                        onChange={(e) => setUserPrefs(prev => ({ ...prev, hasChildren: e.target.value }))}
                        style={{ width: '100%', padding: '8px 16px', border: '1px solid #d1d5db', borderRadius: '8px' }}
                      >
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                      </select>
                    </div>

                    <div style={{ marginBottom: '16px' }}>
                      <label style={{ display: 'block', fontSize: '14px', fontWeight: '500', marginBottom: '8px' }}>Do you have other pets?</label>
                      <select
                        value={userPrefs.hasPets}
                        onChange={(e) => setUserPrefs(prev => ({ ...prev, hasPets: e.target.value }))}
                        style={{ width: '100%', padding: '8px 16px', border: '1px solid #d1d5db', borderRadius: '8px' }}
                      >
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                      </select>
                    </div>

                    {userPrefs.hasPets === 'yes' && (
                      <div style={{ marginBottom: '16px' }}>
                        <label style={{ display: 'block', fontSize: '14px', fontWeight: '500', marginBottom: '8px' }}>What type of pets?</label>
                        <select
                          value={userPrefs.petType}
                          onChange={(e) => setUserPrefs(prev => ({ ...prev, petType: e.target.value }))}
                          style={{ width: '100%', padding: '8px 16px', border: '1px solid #d1d5db', borderRadius: '8px' }}
                        >
                          <option value="dog">Dog(s)</option>
                          <option value="cat">Cat(s)</option>
                          <option value="both">Both</option>
                        </select>
                      </div>
                    )}

                    <div style={{ marginBottom: '16px' }}>
                      <label style={{ display: 'block', fontSize: '14px', fontWeight: '500', marginBottom: '8px' }}>Need hypoallergenic?</label>
                      <select
                        value={userPrefs.needsHypoallergenic}
                        onChange={(e) => setUserPrefs(prev => ({ ...prev, needsHypoallergenic: e.target.value }))}
                        style={{ width: '100%', padding: '8px 16px', border: '1px solid #d1d5db', borderRadius: '8px' }}
                      >
                        <option value="no">No</option>
                        <option value="yes">Yes</option>
                      </select>
                    </div>

                    <button
                      onClick={calculateMatch}
                      style={{
                        width: '100%',
                        background: '#9333ea',
                        color: 'white',
                        padding: '12px',
                        borderRadius: '8px',
                        border: 'none',
                        cursor: 'pointer',
                        fontSize: '16px',
                        fontWeight: '600'
                      }}
                    >
                      🔍 Find My Match
                    </button>
                  </div>
                )}

                {view === 'all-dogs' && (
                  <div style={{ maxWidth: '1000px', margin: '0 auto' }}>
                    <h2 style={{ fontSize: '28px', fontWeight: 'bold', marginBottom: '24px', textAlign: 'center' }}>All Available Dogs</h2>
                    {dogs.map(dog => (
                      <div key={dog.id} style={{ background: 'white', borderRadius: '12px', padding: '24px', marginBottom: '16px', boxShadow: '0 4px 6px -1px rgba(0,0,0,0.1)' }}>
                        <h3 style={{ fontSize: '24px', fontWeight: 'bold', marginBottom: '8px' }}>{dog.name}</h3>
                        <p style={{ color: '#6b7280', marginBottom: '16px' }}>{dog.breed} • {dog.age} • {dog.sex}</p>
                        <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                          <span style={{ padding: '4px 12px', background: '#dbeafe', color: '#1e40af', borderRadius: '16px', fontSize: '14px' }}>{dog.size}</span>
                          <span style={{ padding: '4px 12px', background: '#d1fae5', color: '#065f46', borderRadius: '16px', fontSize: '14px' }}>{dog.energy} energy</span>
                          {dog.leashTrained && <span style={{ padding: '4px 12px', background: '#ccfbf1', color: '#115e59', borderRadius: '16px', fontSize: '14px' }}>leash trained</span>}
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {view === 'results' && (
                  <div style={{ maxWidth: '1000px', margin: '0 auto' }}>
                    <h2 style={{ fontSize: '28px', fontWeight: 'bold', marginBottom: '24px', textAlign: 'center' }}>Your Matches</h2>
                    {matches.map((dog, index) => (
                      <div key={dog.id} style={{ background: 'white', borderRadius: '12px', padding: '24px', marginBottom: '16px', boxShadow: '0 4px 6px -1px rgba(0,0,0,0.1)' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start' }}>
                          <div>
                            <h3 style={{ fontSize: '24px', fontWeight: 'bold', marginBottom: '8px' }}>
                              {dog.name} {index === 0 && '❤️ Best Match'}
                            </h3>
                            <p style={{ color: '#6b7280', marginBottom: '16px' }}>{dog.breed} • {dog.age} • {dog.sex}</p>
                          </div>
                          <div style={{ textAlign: 'right' }}>
                            <div style={{ fontSize: '36px', fontWeight: 'bold', color: '#9333ea' }}>{dog.matchScore}%</div>
                            <div style={{ fontSize: '14px', color: '#6b7280' }}>Match</div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DogMatcher />);
    </script>
</body>
</html>
