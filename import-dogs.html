                let count = 0;
                for (const dog of dogsData) {
                    await addDoc(collection(db, "dogs"), dog);
                    count++;
                    statusDiv.textContent = `Imported ${count} of ${dogsData.length} dogs...`;

                statusDiv.className = 'success';
                statusDiv.innerHTML = `✅ Success! All ${dogsData.length} dogs have been imported to Firebase!<br><br>You can now close this page and delete this file. Your dogs are permanently stored in the database.`;
